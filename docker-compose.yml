
services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    image: project-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    image: project-backend
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      CLIENT_URL: "http://localhost:3000"
      AI_API_URL: "http://ai:8000"
      PYTHON_BACKEND_URL: "http://ai:8000"
    ports:
      - "5000:5000"
    depends_on:
      - ai

  ai:
    image: ai-module
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
